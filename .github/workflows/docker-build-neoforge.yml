name: Docker Build BonoCraft neoforge
#
on:
  push:
    branches: ["*", ]
    tags:
      - '*'
#
jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v4

      # Tags and OCI labels, computed by the action instead of by hand.
      # Replaces three steps: the repo-metadata script call (which broke on the
      # v4->v7 bump, see #42), a git-hash step, and a shell block that assembled
      # the tag list.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-neoforge
          # Reproduces the previous tagging rules one for one:
          #   default branch -> latest        other branch -> branch name
          #   vX.Y.Z         -> vX.Y.Z, vX.Y, vX, latest
          #   other tag      -> the tag       PR -> pr-<n>       schedule -> nightly
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=schedule,pattern=nightly
            type=sha,format=long
          flavor: |
            latest=auto
      # Set up Buildx env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Login
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build image and push to registry
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.neoforge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
